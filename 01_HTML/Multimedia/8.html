<!-- HTML Multimedia -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>HTML Multimedia</title>
</head>

<body>

    <h1>HTML Multimedia Demo</h1>

    <hr>

    <h2>Audio Example</h2>

    <audio controls>

        <source src="audio/sample.mp3"
                type="audio/mpeg">

        Your browser does not support audio.

    </audio>

    <hr>

    <h2>Video Example</h2>

    <video controls width="500">

        <source src="Video/video_1.mp4.mp4"
                type="video/mp4">

        Your browser does not support video.

    </video>

    <hr>

    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube Video"
        allowfullscreen>
    </iframe>

</body>

</html>
