<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>

<body>

    <h1>Student Marks Table</h1>

    <table border="1">

        <caption>Semester Results</caption>

        <thead>

            <tr>

                <th>Name</th>
                <th>Branch</th>
                <th>CGPA</th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <td>Sakshi</td>
                <td>Computer Engineering</td>
                <td>8.88</td>

            </tr>

            <tr>

                <td>Kartik</td>
                <td>Computer Engineering</td>
                <td>9.12</td>

            </tr>

        </tbody>

        <tfoot>

            <tr>

                <td colspan="2">
                    Average CGPA
                </td>

                <td>9.00</td>

            </tr>

        </tfoot>

    </table>

</body>

</html>
