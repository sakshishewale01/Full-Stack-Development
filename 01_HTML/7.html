<!-- HTML Forms -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>

<body>

<h1>Student Registration Form</h1>

<form action="#" method="post">

    <label for="name">Full Name</label>
    <br>

    <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your name"
        required>

    <br><br>

    <label for="email">Email</label>
    <br>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required>

    <br><br>

    <label>Password</label>
    <br>

    <input
        type="password"
        required>

    <br><br>

    <label>Gender</label>
    <br>

    <input
        type="radio"
        name="gender">

    Male

    <input
        type="radio"
        name="gender">

    Female

    <br><br>

    <label>Skills</label>
    <br>

    <input type="checkbox"> HTML
    <br>

    <input type="checkbox"> CSS
    <br>

    <input type="checkbox"> JavaScript

    <br><br>

    <label>City</label>

    <br>

    <select>

        <option>Pune</option>
        <option>Mumbai</option>
        <option>Nashik</option>

    </select>

    <br><br>

    <label>About Yourself</label>

    <br>

    <textarea
        rows="5"
        cols="40">

    </textarea>

    <br><br>

    <input type="submit">

    <input type="reset">

</form>

</body>

</html>
