<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Links</title>
</head>

<body>

    <h1>HTML Links Example</h1>

    <hr>

    <h2>External Link</h2>

    <a href="https://www.google.com">
        Visit Google
    </a>

    <hr>

    <h2>Open in New Tab</h2>

    <a href="https://github.com"
       target="_blank">
        Visit GitHub
    </a>

    <hr>

    <h2>Email Link</h2>

    <a href="mailto:example@gmail.com">
        Send Email
    </a>

    <hr>

    <h2>Phone Link</h2>

    <a href="tel:+919876543210">
        Call Me
    </a>

    <hr>

    <h2>Tooltip Example</h2>

    <a href="https://developer.mozilla.org"
       title="Open MDN Documentation">
        MDN Documentation
    </a>

</body>

</html>
